<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Converter | Tool Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Pixelify+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.min.js"></script>
    <script defer src="../app.js"></script>
    <script defer src="../scripts/converter-image-type.js"></script>
  </head>
  <body data-page="tool" data-tool-page="converter-image-type">
    <div class="page-shell">
      <header class="subpage-hero">
        <a class="back-link" href="../index.html">허브로 돌아가기</a>
        <p class="eyebrow">IMAGE CONVERTER 01</p>
        <h1>Image Converter</h1>
        <p class="hero-copy">
          JPG, PNG, WEBP, SVG, TIFF 이미지를 JPG, PNG, WEBP 중 원하는 형식으로 변환합니다. 전체 통일 변환과
          파일별 지정 변환을 선택할 수 있습니다.
        </p>
      </header>

      <main>
        <section class="tool-panel" data-tool="converter-image-type">
          <div class="tool-heading">
            <p class="eyebrow">UPLOAD</p>
            <h2>이미지 파일 업로드</h2>
            <p>
              여러 파일을 한 번에 선택하고 출력 방식을 지정하세요. 변환 후 개별 다운로드와 전체 ZIP 다운로드를 사용할 수 있습니다.
            </p>
          </div>

          <div class="uploader-box">
            <label class="upload-control">
              <input
                type="file"
                accept=".jpg,.jpeg,.png,.webp,.svg,.tif,.tiff,image/jpeg,image/png,image/webp,image/svg+xml,image/tiff"
                multiple
              />
              <span>이미지 파일 선택</span>
            </label>
            <div class="tool-actions">
              <button type="button" data-action="convert">변환 시작</button>
              <button type="button" data-action="download-all" disabled>ZIP 다운로드</button>
              <button type="button" data-action="clear">초기화</button>
            </div>
          </div>

          <p class="status-line" data-role="status" role="status" aria-live="polite" aria-atomic="true">
            JPG, PNG, WEBP, SVG, TIFF 파일을 선택하면 변환 대기 목록이 표시됩니다.
          </p>
          <div class="file-list" data-role="list"></div>
        </section>
      </main>
    </div>
  </body>
</html>
