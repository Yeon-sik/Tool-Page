<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PNG, JPG, WEBP 이미지 순서를 정해 브라우저에서 GIF로 만듭니다." />
    <meta name="theme-color" content="#070007" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' blob: data:; media-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self'; form-action 'self'"
    />
    <title>GIF 만들기 | Tool Page</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../styles.css?v=20260728" />
    <script defer src="../assets/vendor/gif-0.2.0.js"></script>
    <script defer src="../app.js?v=20260728"></script>
    <script defer src="../scripts/converter-images-to-gif.js?v=20260728"></script>
  </head>
  <body data-page="tool" data-tool-page="images-to-gif">
    <a class="skip-link" href="#main-content">본문 바로가기</a>
    <div class="page-shell">
      <header class="subpage-hero">
        <a class="back-link" href="../index.html">허브로 돌아가기</a>
        <p class="eyebrow">CONVERTER 04</p>
        <h1>Images to GIF</h1>
        <p class="hero-copy">
          PNG, JPG, WEBP 이미지를 한 번에 업로드하고 순서를 정렬한 뒤, 반복 재생 GIF로 묶어 빠르게 내보낼 수 있습니다.
        </p>
      </header>

      <main id="main-content">
        <section class="tool-panel" data-tool="images-to-gif">
          <div class="tool-heading">
            <p class="eyebrow">UPLOAD</p>
            <h2>GIF로 만들 이미지 업로드</h2>
            <p>프레임 순서를 드래그로 바꾸고 속도, 크기, 반복 방식까지 조정해 발표용, 배너용, 밈용 GIF를 바로 생성하세요.</p>
          </div>
          <p class="local-processing-note">
            <strong>처리 방식:</strong> 파일 내용은 서버로 업로드하지 않고 현재 브라우저에서 GIF로 만듭니다. GIF 생성 코드와 worker도
            사이트에 함께 포함되어 있습니다.
          </p>

          <div class="uploader-box">
            <label class="upload-control">
              <input type="file" accept="image/png,image/jpeg,image/webp" multiple />
              <span>이미지 파일 선택</span>
            </label>
            <div class="tool-actions">
              <button type="button" data-action="convert">GIF 생성</button>
              <button type="button" data-action="download-all" disabled>GIF 다운로드</button>
              <button type="button" data-action="clear">초기화</button>
            </div>
          </div>
          <div class="file-list" data-role="list"></div>
        </section>
      </main>
    </div>
  </body>
</html>
