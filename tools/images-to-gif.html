<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Images to GIF | Tool Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Pixelify+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <script defer src="../app.js"></script>
    <script defer src="../scripts/converter-images-to-gif.js"></script>
  </head>
  <body data-page="tool" data-tool-page="images-to-gif">
    <div class="page-shell">
      <header class="subpage-hero">
        <a class="back-link" href="../index.html">허브로 돌아가기</a>
        <p class="eyebrow">CONVERTER 04</p>
        <h1>Images to GIF</h1>
        <p class="hero-copy">
          PNG, JPG, WEBP 이미지를 한 번에 업로드하고 순서를 정렬한 뒤, 반복 재생 GIF로 묶어 빠르게 내보낼 수 있습니다.
        </p>
      </header>

      <main>
        <section class="tool-panel" data-tool="images-to-gif">
          <div class="tool-heading">
            <p class="eyebrow">UPLOAD</p>
            <h2>GIF로 만들 이미지 업로드</h2>
            <p>프레임 순서를 드래그로 바꾸고 속도, 크기, 반복 방식까지 조정해 발표용, 배너용, 밈용 GIF를 바로 생성하세요.</p>
          </div>

          <div class="uploader-box">
            <label class="upload-control">
              <input type="file" accept="image/png,image/jpeg,image/webp" multiple />
              <span>이미지 파일 선택</span>
            </label>
            <div class="tool-actions">
              <button type="button" data-action="convert">GIF 생성</button>
              <button type="button" data-action="download-all" disabled>GIF 다운로드</button>
              <button type="button" data-action="clear">초기화</button>
            </div>
          </div>

          <p class="status-line" data-role="status" role="status" aria-live="polite" aria-atomic="true">
            이미지를 선택하면 드래그 가능한 프레임 목록과 GIF 출력 설정이 표시됩니다.
          </p>
          <div class="file-list" data-role="list"></div>
        </section>
      </main>
    </div>
  </body>
</html>
