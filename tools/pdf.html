<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Tools | Tool Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Pixelify+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script defer src="../app.js"></script>
    <script defer src="../scripts/converter-images-to-pdf.js"></script>
    <script defer src="../scripts/converter-pdf-to-images.js"></script>
  </head>
  <body data-page="tool" data-tool-page="pdf">
    <div class="page-shell">
      <header class="subpage-hero">
        <a class="back-link" href="../index.html">허브로 돌아가기</a>
        <p class="eyebrow">PDF TOOLS</p>
        <h1>PDF Tools</h1>
        <p class="hero-copy">이미지를 PDF로 묶거나 PDF 페이지를 이미지로 렌더링하는 방향을 한 페이지에서 선택합니다.</p>
      </header>

      <main>
        <div class="direction-switcher" data-role="direction-switcher" aria-label="PDF 변환 방향">
          <button type="button" data-direction-target="images-to-pdf" aria-pressed="true">Images to PDF</button>
          <button type="button" data-direction-target="pdf-to-images" aria-pressed="false">PDF to Images</button>
        </div>

        <section class="tool-panel" data-tool="images-to-pdf" data-direction-panel="images-to-pdf">
          <div class="tool-heading">
            <p class="eyebrow">UPLOAD</p>
            <h2>PDF로 묶을 이미지 업로드</h2>
            <p>파일 카드를 잡고 원하는 위치로 드래그하세요. 현재 목록 순서가 그대로 PDF 페이지 순서가 됩니다.</p>
          </div>

          <div class="uploader-box">
            <label class="upload-control">
              <input type="file" accept="image/png,image/jpeg,image/webp" multiple />
              <span>이미지 파일 선택</span>
            </label>
            <div class="tool-actions">
              <button type="button" data-action="convert">PDF 생성</button>
              <button type="button" data-action="download-all" disabled>PDF 다운로드</button>
              <button type="button" data-action="clear">초기화</button>
            </div>
          </div>
          <div class="file-list" data-role="list"></div>
        </section>

        <section class="tool-panel" data-tool="pdf-to-images" data-direction-panel="pdf-to-images" hidden>
          <div class="tool-heading">
            <p class="eyebrow">UPLOAD</p>
            <h2>이미지로 바꿀 PDF 업로드</h2>
            <p>PNG, JPG, WEBP 중 원하는 출력 형식을 고른 뒤 PDF 페이지를 이미지 파일로 변환합니다.</p>
          </div>

          <div class="uploader-box">
            <label class="upload-control">
              <input type="file" accept=".pdf,application/pdf" />
              <span>PDF 파일 선택</span>
            </label>
            <div class="tool-actions">
              <button type="button" data-action="convert">이미지 생성</button>
              <button type="button" data-action="download-all" disabled>ZIP 다운로드</button>
              <button type="button" data-action="clear">초기화</button>
            </div>
          </div>
          <div class="file-list" data-role="list"></div>
        </section>
      </main>
    </div>
  </body>
</html>
