<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PPT to Images | Tool Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Pixelify+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script defer src="../app.js"></script>
    <script defer src="../scripts/converter-ppt-to-images.js"></script>
  </head>
  <body data-page="tool" data-tool-page="ppt-to-images">
    <div class="page-shell">
      <header class="subpage-hero">
        <a class="back-link" href="../index.html">허브로 돌아가기</a>
        <p class="eyebrow">CONVERTER 08</p>
        <h1>PPT to Images</h1>
        <p class="hero-copy">PowerPoint 슬라이드를 선택한 이미지 형식으로 렌더링해 개별 파일과 ZIP으로 내보냅니다.</p>
      </header>

      <main>
        <section class="tool-panel" data-tool="ppt-to-images">
          <div class="tool-heading">
            <p class="eyebrow">UPLOAD</p>
            <h2>이미지로 바꿀 PowerPoint 업로드</h2>
            <p>PPTX 슬라이드를 PNG, JPG, WEBP 이미지로 변환합니다. 구형 PPT는 PPTX로 저장한 뒤 사용해 주세요.</p>
          </div>

          <div class="uploader-box">
            <label class="upload-control">
              <input type="file" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation" />
              <span>PPTX 파일 선택</span>
            </label>
            <div class="tool-actions">
              <button type="button" data-action="convert">이미지 생성</button>
              <button type="button" data-action="download-all" disabled>ZIP 다운로드</button>
              <button type="button" data-action="clear">초기화</button>
            </div>
          </div>

          <p class="status-line" data-role="status" role="status" aria-live="polite" aria-atomic="true">
            PPTX를 선택하면 슬라이드별 이미지가 생성됩니다.
          </p>
          <div class="file-list" data-role="list"></div>
        </section>
      </main>
    </div>
  </body>
</html>
