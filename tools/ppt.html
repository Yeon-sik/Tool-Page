<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PPT Tools | Tool Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Pixelify+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <script defer src="../app.js"></script>
    <script defer src="../scripts/converter-images-to-pptx.js"></script>
    <script defer src="../scripts/converter-ppt-to-images.js"></script>
  </head>
  <body data-page="tool" data-tool-page="ppt">
    <div class="page-shell">
      <header class="subpage-hero">
        <a class="back-link" href="../index.html">허브로 돌아가기</a>
        <p class="eyebrow">PPT TOOLS</p>
        <h1>PPT Tools</h1>
        <p class="hero-copy">이미지를 PowerPoint 슬라이드로 만들거나 PPTX 슬라이드를 이미지로 변환하는 방향을 선택합니다.</p>
      </header>

      <main>
        <div class="direction-switcher" data-role="direction-switcher" aria-label="PPT 변환 방향">
          <button type="button" data-direction-target="images-to-pptx" aria-pressed="true">Images to PPTX</button>
          <button type="button" data-direction-target="ppt-to-images" aria-pressed="false">PPT to Images</button>
        </div>

        <section class="tool-panel" data-tool="images-to-pptx" data-direction-panel="images-to-pptx">
          <div class="tool-heading">
            <p class="eyebrow">UPLOAD</p>
            <h2>PowerPoint로 만들 이미지 업로드</h2>
            <p>슬라이드 순서는 드래그로 조정합니다. 현재 정렬 그대로 각 이미지가 한 장의 슬라이드에 배치됩니다.</p>
          </div>

          <div class="uploader-box">
            <label class="upload-control">
              <input type="file" accept="image/png,image/jpeg,image/webp" multiple />
              <span>이미지 파일 선택</span>
            </label>
            <div class="tool-actions">
              <button type="button" data-action="convert">PPTX 생성</button>
              <button type="button" data-action="download-all" disabled>PPTX 다운로드</button>
              <button type="button" data-action="clear">초기화</button>
            </div>
          </div>
          <div class="file-list" data-role="list"></div>
        </section>

        <section class="tool-panel" data-tool="ppt-to-images" data-direction-panel="ppt-to-images" hidden>
          <div class="tool-heading">
            <p class="eyebrow">UPLOAD</p>
            <h2>이미지로 바꿀 PowerPoint 업로드</h2>
            <p>PPTX 슬라이드를 PNG, JPG, WEBP 이미지로 변환합니다. 구형 PPT는 PPTX로 저장한 뒤 사용해 주세요.</p>
          </div>

          <div class="uploader-box">
            <label class="upload-control">
              <input type="file" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation" />
              <span>PPTX 파일 선택</span>
            </label>
            <div class="tool-actions">
              <button type="button" data-action="convert">이미지 생성</button>
              <button type="button" data-action="download-all" disabled>ZIP 다운로드</button>
              <button type="button" data-action="clear">초기화</button>
            </div>
          </div>
          <div class="file-list" data-role="list"></div>
        </section>
      </main>
    </div>
  </body>
</html>
